<script type="module">
  // Render ```mermaid fenced blocks (emitted by kramdown/rouge as div.language-mermaid) client-side
  const blocks = document.querySelectorAll('div.language-mermaid');
  if (blocks.length) {
    const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
    blocks.forEach((block) => {
      const pre = document.createElement('pre');
      pre.className = 'mermaid';
      pre.textContent = block.querySelector('code').textContent;
      block.replaceWith(pre);
    });
    mermaid.initialize({ startOnLoad: false });
    await mermaid.run({ querySelector: 'pre.mermaid' });
  }
</script>
